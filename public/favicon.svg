<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Window frame -->
  <rect x="4" y="4" width="40" height="40" rx="4" ry="4" fill="#171717"/>
  <!-- Window panes - horizontal divider -->
  <line x1="4" y1="24" x2="44" y2="24" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Window panes - vertical divider -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Frame inner border -->
  <rect x="4" y="4" width="40" height="40" rx="4" ry="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
</svg>
